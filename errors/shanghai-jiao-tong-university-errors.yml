method: searched
source: https://developer.sjtu.edu.cn/api/overview.html#错误代码
x-operator: institution
format: sjtu-envelope
rfc9457: false
note: >-
  SJTU does NOT use RFC 9457 application/problem+json. Errors are carried in the same envelope as
  success: a JSON body with an integer errno, an optional error string and total. errno 0 means the
  call succeeded. The overview documents that a 403 in particular always carries a specific reason in
  the body — and the live gateway confirms it: an unauthenticated GET of
  https://api.sjtu.edu.cn/v1/me/profile on 2026-08-30 returned
  {"errno":10002,"error":"Authentication Failed.","total":0} with HTTP 403.

  Two behaviours are worth an integrator's attention. First, the HTTP status and errno are not always
  aligned — the notification example in the documentation shows a FAILED call returning HTTP 200 with
  errno 10001, so a client that switches on the status code alone will read a failure as a success.
  Second, the error string carries structured detail inline as
  "BAD_PARAMETERS\n\nMORE_INFORMATION:phones is required" rather than in a separate field.
envelope:
  content_type: application/json;charset=UTF-8
  fields:
    errno: Integer error code. 0 on success.
    error: Optional human-readable message. May embed MORE_INFORMATION:<detail> after a blank line.
    total: Optional record count; 0 on error.
  example:
    errno: 10002
    error: Authentication Failed.
    total: 0
status_codes:
- status: 200
  description: OK — the request succeeded. May still carry a non-zero errno; check errno, not the status.
- status: 400
  description: Bad Request — usually a parameter error.
- status: 403
  description: Forbidden — usually an authentication or scope failure. The body names the reason.
- status: 404
  description: Not Found — usually a wrong resource path.
- status: 405
  description: Method Not Allowed — usually a wrong request method.
- status: 500
  description: Internal Server Error — an error inside API processing.
- status: 503
  description: Service Unavailable — the API server is restarting for maintenance or is down.
