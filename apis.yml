- aid: shanghai-jiao-tong-university:jaccount-oauth
  name: jAccount Authorization Server (OAuth 2.0 / OpenID Connect)
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/shanghai-jiao-tong-university.png
  x-operator: institution
  description: >-
    SJTU's own identity and single sign-on system, run by the Network and Information Center on the
    university's own domain. It is a real OAuth 2.0 authorization server — an unparameterised GET of
    the authorize endpoint returned the correct RFC 6749 error on 2026-08-30 — and it publishes
    OpenID Connect provider metadata at /oauth2/.well-known/openid-configuration. Three grants are
    documented per operation: authorization code, client credentials and resource-owner password.
    The published scope registry runs to 39 scopes on a bitmask (1<<n) model, which callers may
    combine either by name or by arithmetic sum. Two caveats an integrator needs: the discovery
    document is served at the issuer-relative path rather than the host root, so a conventional
    root probe misses it entirely; and id_token_signing_alg_values_supported is HS256 only, so ID
    tokens are symmetrically signed with the client secret and cannot be verified by a public client.
  humanURL: https://developer.sjtu.edu.cn/auth/oidc.html
  baseURL: https://jaccount.sjtu.edu.cn/oauth2
