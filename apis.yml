aid: shanghai-jiao-tong-university
name: Shanghai Jiao Tong University
x-type: university
x-category: Public Research University
description: >-
  Shanghai Jiao Tong University (上海交通大学, SJTU), founded 1896 in Shanghai, is a C9 League public
  research university and one of very few institutions anywhere that operates a first-party API
  platform rather than buying one. Its Network and Information Center runs a documented developer
  portal covering three institution-operated surfaces, all on sjtu.edu.cn and none a vendor
  tenancy: the jAccount OAuth 2.0 / OpenID Connect / Shibboleth identity provider; a REST Open API
  at api.sjtu.edu.cn with 59 documented operations across 13 families (profile, directory, campus
  card, Siyuan payment code, timetables, exams and GPA, mail, notifications, files, finance,
  barcode, calendar, e-signature); and a gated Data Resources API. Alongside sit the 交我办 campus
  super-app and the 交我算 HPC service. What SJTU does not publish is equally real: no OpenAPI,
  changelog, status page, deprecation policy or self-service signup; docs only in Chinese; and no
  Crossref, DataCite, ORCID or OAI-PMH anywhere.
