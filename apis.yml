- aid: shanghai-jiao-tong-university:jaccount-shibboleth
  name: SJTU Identity Provider (Shibboleth / SAML 2.0)
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/shanghai-jiao-tong-university.png
  x-operator: institution
  description: >-
    SJTU operates a Shibboleth identity provider and publishes its SAML metadata openly at
    https://jaccount.sjtu.edu.cn/idp/shibboleth — entityID matching the URL, shibmd:Scope
    sjtu.edu.cn, display name "SJTU Identity Provider", supporting SAML 2.0, SAML 1.1 and Shibboleth
    1.0 with four SSO bindings, four single-logout bindings, artifact resolution and a SAML 1.1
    attribute authority. This is the surface that federates SJTU into CARSI, the Chinese national
    research-and-education federation, which has been a full eduGAIN member since 2019 — so an SJTU
    login reaches licensed resources internationally through this one entity. Identity federation is
    institution-operated by definition, it is machine-readable, and it is almost never catalogued;
    it is also the strongest education-regime conformance signal SJTU has. Fetched and saved
    2026-08-30.
  humanURL: https://jaccount.sjtu.edu.cn/idp/shibboleth
  baseURL: https://jaccount.sjtu.edu.cn/idp
