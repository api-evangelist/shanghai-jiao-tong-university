- aid: shanghai-jiao-tong-university:data-resources
  name: SJTU Data Resources API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/shanghai-jiao-tong-university.png
  x-operator: institution
  description: >-
    数据资源 — the university's institutional data-exchange API, exposing account, faculty and staff,
    undergraduate-teaching, academic-paper and asset records produced by SJTU's own administrative
    systems. The current contract is REST: ten GET operations under https://graphql.sjtu.edu.cn/v1
    with query-string filters, first/offset paging capped at 200, OAuth 2.0 client credentials and
    the exchange_data scope. The host name is a fossil — an earlier GraphQL implementation POSTed
    queries to /graphql and is now labelled 老版本 (old version) on every data-resource page. This
    repo described only that GraphQL form until 2026-08-30. Access is doubly gated: by the
    数据资源申请流程 approval workflow, which grants FIELDS rather than endpoints, and by campus-network
    restriction — an off-campus request is 302'd to restrict.sjtu.edu.cn and told to use the SJTU VPN.
    Probed 2026-08-30 and confirmed live-and-gated, not dead.
  humanURL: https://developer.sjtu.edu.cn/graphql/overview.html
