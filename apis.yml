apis:
- aid: shanghai-jiao-tong-university:open-api
  name: SJTU Open API
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/shanghai-jiao-tong-university.png
  x-operator: institution
  description: >-
    The university's own REST API platform (开放API), operated by the SJTU Network and Information
    Center at api.sjtu.edu.cn under OAuth 2.0 issued by its own jAccount authorization server. 59
    documented operations across 13 families: Profile, Task, Enterprise, File, Notification, Mail,
    Finance, Education, Card, Unicode (思源码), Barcode, Calendar and Signature. Every response uses
    one envelope — errno, error, total, nextToken, entities[] — and field release is scope
    controlled, so the same Profile operation returns a different object shape to a `basic` token
    than to a `privacy` one. Verified live 2026-08-30: an unauthenticated GET of /v1/me/profile
    returns HTTP 403 with the documented {"errno":10002,"error":"Authentication Failed."}. SJTU
    publishes no OpenAPI; the specification here is DERIVED from the university's own HTML
    documentation and marked as such in info.x-provenance.
