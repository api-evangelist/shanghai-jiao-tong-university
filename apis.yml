- aid: shanghai-jiao-tong-university:jiaowoban
  name: Jiao Wo Ban (交我办) Process Platform
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/shanghai-jiao-tong-university.png
  x-operator: institution
  description: >-
    SJTU's campus super-app and the low-code process platform behind it, on which the university and
    approved third parties build workflow applications for staff and students. The developer portal
    ships a full first-party developer programme for it — platform introduction, development
    standards, a guide covering form design, field and repeat controls, mobile views, print
    templates, master-detail structures, workflow modelling, permissions, notifications, dynamic
    formulas, styles, validation and scripts, a Messenger event model, a JsSdk, IFrame control
    development, parent/child processes and export. It is also the registration surface for every
    other SJTU API: applications are submitted here or at my.sjtu.edu.cn under Service Hall ->
    Information Services -> jAccount interface application. No REST contract is published for the
    platform itself, so no specification is asserted; IDE access is granted by the Network and
    Information Center on request against a named jAccount.
  humanURL: https://developer.sjtu.edu.cn/form/guide/introduce.html
  baseURL: https://my.sjtu.edu.cn/
