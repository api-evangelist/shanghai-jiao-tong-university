x-coverage:
  state: covered
  reason: covered
  generated: '2026-08-30'
  method: probed
  detail: >-
    Shanghai Jiao Tong University is one of the rare institutions in this cohort where the answer to
    "who operates this?" is the institution itself, on every surface. All five recorded surfaces sit
    under sjtu.edu.cn, all five are run by the university's Network and Information Center, and not
    one is a vendor tenancy — there is no Figshare, no Elsevier Pure, no Ex Libris, no Dataverse and
    no Symplectic contract in this repo to remove. The audit's six institution verdicts and zero
    tenant verdicts were correct; what the June 2026 profile got wrong was scope and currency, not
    ownership.

    Three corrections landed on 2026-08-30. First, the entire Open API platform at api.sjtu.edu.cn —
    59 operations across 13 families, a 39-scope OAuth registry, a documented error table and a
    published set of design rules — was missing from the profile altogether. Second, the Data
    Resources API had migrated from GraphQL to REST with no Sunset header, no changelog and no dated
    signal of any kind, and the profile still described the superseded GraphQL endpoint; it had also
    gained a fifth data category (资产类, assets). Third, the profile split one gated data platform
    into five apis[] entries by category, which is the same footprint-inflation pattern that vendor
    tag-splitting produces; those are collapsed into one surface here.

    Two genuinely new finds. SJTU publishes OpenID Connect provider metadata at
    /oauth2/.well-known/openid-configuration — served at the issuer-relative path, not the host root,
    which is why a conventional probe never saw it — and Shibboleth SAML 2.0 identity-provider
    metadata at /idp/shibboleth, federating the university into CARSI and, through it, eduGAIN.
    Identity federation is institution-operated by definition and almost never catalogued; it is the
    strongest education-regime conformance evidence in this repo.

    What SJTU does not publish is recorded as plainly as what it does. No OpenAPI on any host, no
    changelog, no status page, no deprecation or versioning policy, no security.txt, no llms.txt, no
    agent card, no api-catalog, no self-service signup, and no public source. The documentation
    exists only in Chinese. The scholarly gap is the widest: the Paper API carries `doi` and `wos`
    as opaque strings but conforms to neither Crossref, DataCite nor ORCID, and no OAI-PMH endpoint
    could be reached anywhere on sjtu.edu.cn. Two surfaces could not be read from outside China —
    graphql.sjtu.edu.cn is campus-network restricted by design and 302s to restrict.sjtu.edu.cn,
    which is a finding about SJTU; scholar.sjtu.edu.cn completes TLS and then returns nothing, which
    is a finding about our vantage and is marked unverified rather than dead.
