- name: Legacy GraphQL query (superseded)
  method: searched
  source: https://developer.sjtu.edu.cn/graphql/graphql.html
  request: |
    { tm_class(first: 1, offset: 10, filter: {name: {eq: "123"}}) { num name id } }
  note: >-
    The 老版本 (old version) Data Resources interface, POSTed to https://graphql.sjtu.edu.cn/graphql
    as {"query": "..."}. Every current data-resource page now documents REST GETs under
    https://graphql.sjtu.edu.cn/v1 instead. Kept here because the API Evangelist profile of SJTU
    described only this form until 2026-08-30.
- name: LIVE — unauthenticated call to the Open API gateway
  method: probed
  probed: '2026-08-30'
  request: |
    GET https://api.sjtu.edu.cn/v1/me/profile
  response: |
    HTTP/1.1 403 Forbidden

    {"errno":10002,"error":"Authentication Failed.","total":0}
  note: The gateway is live and enforcing OAuth. This is the documented errno 10002.
- name: LIVE — unparameterised call to the authorize endpoint
  method: probed
  probed: '2026-08-30'
  request: |
    GET https://jaccount.sjtu.edu.cn/oauth2/authorize
  response: |
    HTTP/1.1 400 Bad Request

    {"error":"invalid_request","error_description":"Missing response_type parameter value"}
  note: A correct RFC 6749 error response from a real authorization server.
- name: LIVE — Data Resources host from off campus
  method: probed
  probed: '2026-08-30'
  request: |
    GET https://graphql.sjtu.edu.cn/v1/account/info
  response: |
    HTTP/1.1 302 Found
    Location: https://restrict.sjtu.edu.cn/

    <SJTU campus restriction page: "抱歉，如果您是在校外访问本网站。建议您先拨通学校的VPN后再访问。">
  note: >-
    Campus-network restriction, not a dead host. Any harvest of this surface from outside the SJTU
    network will see the restriction page, and reading that as a 200 is exactly the soft-200 trap.
