generated: '2026-08-30'
method: searched
source: https://developer.sjtu.edu.cn/
x-operator: institution
note: >-
  Request and response examples read verbatim from SJTU's own developer-portal documentation, plus
  three responses we captured live from SJTU hosts on 2026-08-30. The live captures are marked
  method: probed and are the evidence that these are running services rather than documented
  intentions. Placeholder values (tokenxxx, xxxxxxx, 张三) are the university's own.
examples:
- name: Authorization-code authentication request
  method: searched
  source: https://developer.sjtu.edu.cn/auth/oidc.html
  request: |
    GET /oauth2/authorize?response_type=code&scope=openid&client_id=s6BhdRkqt3&redirect_uri=https%3A%2F%2Fclient.example.org%2Fcb HTTP/1.1
    Host: jaccount.sjtu.edu.cn
- name: jAccount ID token payload
  method: searched
  source: https://developer.sjtu.edu.cn/auth/oidc.html
  response: |
    {
      "iss": "https://jaccount.sjtu.edu.cn/oauth2/",
      "sub": "test-user",
      "aud": "s6BhdRkqt3",
      "nonce": "n-0S6_WzA2Mj",
      "exp": 1311281970,
      "iat": 1311280970,
      "name": "张三",
      "code": "123456",
      "type": "student"
    }
  note: >-
    sub is the jAccount name, code is the default identity's student/staff number, and type is the
    default identity type. All three are SJTU claims on top of standard OIDC.
- name: Bearer token in the Authorization header
  method: searched
  source: https://developer.sjtu.edu.cn/api/overview.html
  request: |
    GET /v1/me/profile HTTP/1.1
    Host: api.sjtu.edu.cn
    Authorization: Bearer tokenxxx
- name: Token as a query parameter
  method: searched
  source: https://developer.sjtu.edu.cn/api/overview.html
  request: |
    GET /v1/me/profile?access_token=tokenxxx HTTP/1.1
    Host: api.sjtu.edu.cn
- name: Successful profile response
  method: searched
  source: https://developer.sjtu.edu.cn/api/overview.html
  response: |
    HTTP/1.1 200 OK
    Content-Type: application/json;charset=UTF-8

    {
      "errno": 0,
      "error": "success",
      "total": 0,
      "entities": [{
        "id": "A0000000-1111-2222-3333-012345678901",
        "account": "testprofile",
        "name": "张三",
        "kind": "canvas.profile",
        "timeZone": 0
      }]
    }
- name: Failed call that still returns HTTP 200
  method: searched
  source: https://developer.sjtu.edu.cn/api/overview.html
  response: |
    HTTP/1.1 200
    Content-Type: application/json;charset=UTF-8

    {
      "errno": 10001,
      "error": "BAD_PARAMETERS\n\nMORE_INFORMATION:phones is required",
      "total": 0
    }
  note: >-
    The integration hazard on this platform. A client must branch on errno, not on the HTTP status.
- name: Send a notification
  method: searched
  source: https://developer.sjtu.edu.cn/api/overview.html
  request: |
    PUT https://api.sjtu.edu.cn/v1/notification HTTP/1.1
    Content-Type: application/json

    {
      "name": "邮件标题",
      "content": "邮件内容",
      "emails": ["yech@sjtu.edu.cn"],
      "channels": ["email"]
    }
