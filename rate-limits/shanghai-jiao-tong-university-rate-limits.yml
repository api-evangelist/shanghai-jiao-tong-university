description: >-
  Shanghai Jiao Tong University publishes NO rate-limit documentation for any of its APIs. The Open
  API overview documents status codes, error codes, paging and the request envelope but names no
  quota, no throttle, no 429 behaviour and no Retry-After contract; there is no X-RateLimit header
  family in any documented response. The only published volume constraint anywhere on the platform
  is a paging cap: the Data Resources API limits offset to 200 records per call, and the Open API
  defaults limit to 100. Reviewed against the developer portal on 2026-08-30 — this is a documented
  absence, not an unchecked one, and the earlier reference here to OAI-PMH, IIIF and library
  harvesting endpoints was scaffold text describing surfaces SJTU does not operate.
notes: >-
  No published limits. Treat the 200-record Data Resources page cap and the 100-record Open API
  default as the only stated volume constraints, and contact the Network and Information Center for
  anything bulk.
