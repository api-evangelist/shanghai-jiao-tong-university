  schemas:
    Envelope:
      type: object
      description: The common response envelope every SJTU open API returns.
      properties:
        errno:
          type: integer
          description: Error code. 0 means the call succeeded.
          example: 0
        error:
          type: string
          description: Optional error message.
          example: success
        total:
          type: integer
          description: Optional; present when paging. Total number of matching records, so total >= entities.length.
        nextToken:
          type: string
          description: Optional; present when paging. Pass back as pageToken to fetch the next page. Absent
            on the last page.
        entities:
          type: array
          description: Returned objects. Length 0 when there is no object; a single object is at entities[0].
          items:
            type: object
      required:
      - errno
    Error:
      type: object
      description: Error payload. errno carries the SJTU API error code; see errors/shanghai-jiao-tong-university-errors.yml.
      properties:
        errno:
          type: integer
          example: 10002
        error:
          type: string
          example: Authentication Failed.
        total:
          type: integer
          example: 0
      required:
      - errno
    Profile:
      type: object
      title: Profile
      description: jAccount user profile. Each field is released only to tokens holding one of the scopes
        named in its description — field-level scope control is enforced by the platform.
      properties:
        id:
          type: string
          format: uuid
          description: Natural-person identifier (scopes basic, essential, profile, privacy). Absent for
            non-personal accounts such as group accounts. Multiple accounts for the same natural person
            share this id.
        account:
          type: string
          description: jAccount account name (basic, essential, profile, privacy).
        name:
          type: string
          description: Real name (basic, essential, profile, privacy).
        kind:
          type: string
          enum:
          - canvas.profile
          description: Object type marker (basic, essential, profile, privacy).
        code:
          type: string
          description: Student or staff number of the default identity (essential, profile, privacy).
        userType:
          type: string
          description: Identity type of the default identity (essential, profile, privacy). See vocabulary/shanghai-jiao-tong-university-vocabulary.yml.
          enum:
          - faculty
          - student
          - yxy
          - fs
          - vip
          - postphd
          - external_teacher
          - summer
          - alumni
          - green
          - outside
          - fszxjs
          - freshman
          - team
        organize:
          type: object
          description: Organizational unit of the default identity (essential, profile, privacy).
          properties:
            id:
              type: string
            name:
              type: string
        topOrganize:
          type: object
          description: Second-level unit owning the default identity (essential, profile, privacy). The
            docs warn against persisting this value.
          properties:
            id:
              type: string
            name:
              type: string
        classNo:
          type: string
          description: Class number when userType is student (profile, privacy).
        avatars:
          type: object
          description: Avatar images (privacy).
          properties:
            uriTiny:
              type: string
              format: uri
            uriNormal:
              type: string
              format: uri
        timeZone:
          type: integer
          description: Time-zone offset.
