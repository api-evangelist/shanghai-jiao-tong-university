description: >-
  Shanghai Jiao Tong University charges nothing for API access and publishes no pricing page of any
  kind. Its three programmable surfaces — the Open API at api.sjtu.edu.cn, the Data Resources API at
  graphql.sjtu.edu.cn and the jAccount identity platform — are all free, and all gated by approval
  rather than by payment. There is no self-service tier and no anonymous tier: an application must
  be registered through my.sjtu.edu.cn or the 交我办 app to receive an appId and a 48-character
  appSecret, and every OAuth scope must be separately approved. Data Resources access additionally
  requires the 数据资源申请流程 approval workflow, which grants named FIELDS rather than endpoints,
  and its host is restricted to the campus network. Verified 2026-08-30.
notes: >-
  No commercial pricing exists to record. "Free / Open" here means free-of-charge, NOT
  openly callable — nothing SJTU operates can be called without an approved jAccount application.
